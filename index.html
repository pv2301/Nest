<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Registro interno de ocorrências. Documento confidencial de uso da equipe.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#00C5BB">
<script>
/* Antes da pintura, de propósito: aplicado pelo app.js a tela nasceria no tema do
   sistema e corrigiria depois, piscando. Seis linhas no HTML valem o piscar a menos.
   Sem preferência guardada, nada é escrito e o sistema decide. */
(function(){
  try {
    var t = JSON.parse(localStorage.getItem('reg.tema') || 'null');
    if(t !== 'claro' && t !== 'escuro') return;
    document.documentElement.dataset.theme = t === 'escuro' ? 'dark' : 'light';
    var m = document.querySelector('meta[name=theme-color]');
    if(m) m.content = t === 'escuro' ? '#101713' : '#00C5BB';
  } catch(e){}
})();
</script>
<title>Registro de ocorrências</title>
<link rel="icon" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div class="app">
    <div id="faixa"></div>
    <div id="chrome"></div>
    <div class="scroll" id="scroll">
      <!-- Fica atrás do conteúdo: aparece no vão que se abre quando a tela desce. -->
      <div id="puxar" class="puxar" aria-hidden="true"><span class="roda"></span></div>
      <div class="pad" id="view">
        <div class="empty"><div class="big">Carregando…</div></div>
      </div>
    </div>
    <div id="tabs"></div>
  </div>

  <noscript>
    <div style="padding:24px;text-align:center">
      Este aplicativo precisa de JavaScript para funcionar. Ative-o no navegador e recarregue a página.
    </div>
  </noscript>

  <!-- Estes dois endereços nunca mudam de nome: não há etapa de compilação que
       gere app.a3f9c1.js, e isso é escolha do projeto — editar um arquivo e
       publicar, sem ferramenta no meio.

       O preço é que o cache não pode prometer imutabilidade. Por um tempo
       prometeu: /assets/* saía com max-age de um ano e 'immutable', e um celular
       que abriu o app continuou rodando o JavaScript daquele dia, com um bug de
       toque já corrigido, sem que recarregar resolvesse. Hoje js e css saem com
       'no-cache' — guardados, mas revalidados — em vercel.json. Se um dia entrar
       uma etapa de compilação com nome versionado, aí sim 'immutable' volta.

       Detalhe medido no ar: quando duas regras de cabeçalho casam com o mesmo
       endereço, a última vence. Por isso a regra ampla de /assets/ vem antes das
       específicas de js e css, e não depois — invertido, ela sobrescrevia o
       'no-cache' que acabara de ser posto. -->
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
