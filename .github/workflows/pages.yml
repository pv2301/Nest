# Publica o site no GitHub Pages a cada push na main.
#
# O passo "configure-pages" com enablement: true ATIVA o Pages sozinho na primeira
# execução, usando o token do próprio workflow — não é preciso mexer em
# Settings → Pages.
#
# Se este workflow falhar com 403 em "configure-pages", o repositório está com
# Settings → Actions → General → Workflow permissions em somente leitura.
# Mude para "Read and write permissions", salve, e execute o workflow de novo.

name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Pages (e ativar, se ainda não estiver)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          # O projeto é estático e não tem build: a raiz já é o site.
          path: '.'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
