# Publica o site no GitHub Pages a cada push.
#
# IMPORTANTE: o ambiente "github-pages" só aceita deploy da BRANCH PADRÃO do
# repositório. Hoje a padrão é ccr-c0b9af95-o5sryf. Se a padrão for trocada para
# main (Settings → General → Default branch), a publicação passa a sair de lá e
# esta lista pode ser reduzida a [main].
#
# Uma execução a partir de uma branch que não é a padrão falha em segundos, sem
# rodar nenhum passo — é a regra do ambiente recusando, não erro do workflow.

name: Publicar site

on:
  push:
    # Só a branch padrão: um push em qualquer outra falharia na regra do ambiente.
    branches: [ccr-c0b9af95-o5sryf]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Pages (e ativar, se ainda não estiver)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          # O projeto é estático e não tem build: a raiz já é o site.
          path: '.'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
